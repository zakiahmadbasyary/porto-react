<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Monogram Gradient -->
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    
    <!-- Subtle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Ambient Light Center Glow -->
  <circle cx="256" cy="256" r="160" fill="#0284c7" opacity="0.15" />

  <!-- Monogram "ZA" Symbol -->
  <g filter="url(#glow)">
    <!-- Letter Z (Emerald to Cyan gradient) -->
    <path d="M 135 165 L 285 165 L 160 345 L 285 345" fill="none" stroke="url(#monoGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Letter A (Clean Pure White with Slate accent) -->
    <path d="M 315 345 L 375 165 L 435 345 M 342 295 L 408 295" fill="none" stroke="#F5F5F5" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Modern Code/Terminal Accent Dot -->
    <circle cx="285" cy="165" r="14" fill="#38bdf8" />
  </g>
</svg>